[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qpso-research"
version = "0.1.0"
description = "PSO vs Quantum PSO comparison framework"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
quantum = [
    "qiskit>=1.0",
    "qiskit-aer>=0.14",
]
dev = [
    "pytest>=7.0",
]

[project.scripts]
qpso-compare = "qpso_research.cli:run_comparison"
qpso-study = "qpso_research.cli:run_full_study"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
