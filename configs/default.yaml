# Quick test configuration — 3 benchmarks, 2 dimensions, 5 runs
# Usage: python experiments/run_full_study.py --config configs/default.yaml

benchmarks:
  - sphere
  - rastrigin
  - rosenbrock

dimensions: [2, 5]
num_runs: 5
num_particles: 30
max_iterations: 150
success_threshold: 1.0e-6
stagnation_limit: 15
seed: 42
qpso_modes: ["math"]
verbose: true
results_dir: results

pso:
  inertia_start: 0.9
  inertia_end: 0.4
  cognitive_coef: 1.494
  social_coef: 1.494
  velocity_clamp: 0.2

qpso:
  beta_start: 1.0
  beta_end: 0.5
  cognitive_coef: 1.494
  social_coef: 1.494
  shots: 256
